---
- name: Remove existing nvim configuration
  ansible.builtin.file:
    dest: "{{ ansible_user_dir }}/.config/nvim"
    state: absent

- name: Download nvim-basic-ide from git  # noqa latest[git]
  ansible.builtin.git:
    repo: https://github.com/LunarVim/nvim-basic-ide.git
    dest: "{{ ansible_user_dir }}/.config/nvim"
